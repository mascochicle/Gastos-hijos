<meta charset="utf-8">
<title>MasMoney se mudó</title>
<meta name="robots" content="noindex">
<!-- MasMoney vive ahora en su propio repo. Es el MISMO dominio, así que el localStorage
     (los datos) se conserva: solo cambia la ruta. -->
<meta http-equiv="refresh" content="0; url=https://mascochicle.github.io/masmoney/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1013;color:#E7E9EE;
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:26px;text-align:center}
  a{color:#8B96F0}
</style>
<div>
  <p><b>MasMoney</b> ahora vive aquí:</p>
  <p><a href="https://mascochicle.github.io/masmoney/">mascochicle.github.io/masmoney/</a></p>
  <p style="color:#8A8F9A;font-size:12.5px">Tus datos siguen ahí: es el mismo dominio.</p>
</div>
<script>
/* El service worker viejo quedó cacheando esta ruta; se da de baja para que el redirect
   llegue siempre y no se siga sirviendo la app anterior desde el caché. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if(k.indexOf('masmoney')===0) caches.delete(k); }); });
}
location.replace('https://mascochicle.github.io/masmoney/');
</script>
